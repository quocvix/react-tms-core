<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="React TMS Core — Task Management System"
        />
        <title>React TMS Core</title>
        <style>
            /* Inline critical CSS: loading spinner shown before React hydrates */
            #root-loader {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                background: #f8fafc;
            }
            @media (prefers-color-scheme: dark) {
                #root-loader {
                    background: #0b1220;
                }
                #root-loader .spinner {
                    border-color: #1f2937;
                    border-top-color: #3b82f6;
                }
            }
            #root-loader .spinner {
                width: 32px;
                height: 32px;
                border: 3px solid #d1d5db;
                border-top-color: #1d4ed8;
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <div id="root">
            <!-- Shown instantly while JS loads, removed by React -->
            <div id="root-loader"><div class="spinner"></div></div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
